version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: greenai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: greenai-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: greenai
      JWT_SECRET_KEY: change_this_to_a_long_random_string
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: greenai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
